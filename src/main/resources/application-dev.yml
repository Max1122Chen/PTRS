spring:
  devtools:
    restart:
      # 管理端采集会写入 osm-data / indoor，避免热重启打断长耗时 generate-from-osm 请求
      additional-exclude: osm-data/**,dev-seed/indoor/**
  config:
    activate:
      on-profile: dev
    # 即梦/LibTV：将 config/jimeng-animation.example.yml 复制为 jimeng-animation.yml 后在此填写密钥（文件已 gitignore）
    import: optional:classpath:config/jimeng-animation.yml

app:
  security:
    # 开发环境默认关闭鉴权，便于无数据库/无登录态调试。
    auth-enabled: false
  debug:
    # 开发环境数据库不可用时允许启动，触发内存种子数据回填。
    ignore-db-connection-failure: true
  dev-seed:
    # 开发环境默认开启测试种子数据。
    enabled: true
  media:
    # 开发环境附件落盘目录。
    base-path: data/media
