spring:
  application:
    name: travel-system

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/travelsystem?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ryemon1122
    type: com.alibaba.druid.pool.DruidDataSource

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000

  jackson:
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

server:
  port: 8080

management:
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: "health,info"

logging:
  level:
    com.travel: INFO
    com.baomidou.mybatisplus: INFO

jwt:
  secret: change_this_to_a_strong_secret_key
  expire-seconds: 3600

app:
  security:
    # 生产/默认环境开启鉴权；开发环境可在 application-dev.yml 覆盖为 false。
    auth-enabled: true
  dev-seed:
    # 全局默认关闭开发种子数据，仅在 dev 配置中开启。
    enabled: true
    # 开发种子数据目录（支持 classpath: 或 file:）。
    path: classpath:dev-seed
    # 地图增量导入配置（JSON），用于声明需要额外读取的景区/POI/设施/道路文件。
    map-import-config: classpath:dev-seed/map-imports.json
  storage:
    preload:
      enabled: false
  admin:
    dev-tools:
      # 管理员开发工具（地名采集/构建）开关，生产环境建议关闭。
      enabled: true
  debug:
    # 调试开关：当数据库不可用时，跳过预加载并允许应用启动。
    ignore-db-connection-failure: false
  media:
    # 附件本地存储根目录（图片、视频按子目录保存）。
    base-path: data/media
    # 资源公开访问前缀。
    url-prefix: /media
  animation:
    # 旅游动画（即梦主力 + LibTV 备用）。密钥建议用环境变量覆盖。
    enabled: true
    # 供 LibTV 会话文案中引用可公网访问的图片 URL（勿用 localhost 若厂商无法访问）。
    public-base-url: http://localhost:8080
    jimeng:
      enabled: true
      access-key-id: ${VOLCENGINE_ACCESS_KEY_ID:}
      secret-access-key: ${VOLCENGINE_SECRET_ACCESS_KEY:}
      req-key-image-to-video: jimeng_i2v_first_v30
      req-key-text-to-video: jimeng_ti2v_v30_pro
      extra-submit-json: '{"aspect_ratio":"16:9"}'
      # 随机种子；-1 表示随机（即梦常见写法）
      seed: -1
      # 可选：轮询 CVSync2AsyncGetResult 时 req_json.aigc_meta（JSON 对象字符串）；合规场景按需填写
      aigc-meta-json: ""
      poll-interval-ms: 3000
      poll-timeout-ms: 900000
    libtv:
      enabled: true
      access-key: ${LIBTV_ACCESS_KEY:}
      base-url: https://im.liblib.tv
      upload-path: /openapi/upload
      poll-interval-ms: 8000
      poll-timeout-ms: 900000
  diary:
    content-compression:
      # 开启后：写库使用 RAW:/GZB64: 协议；读取时自动解码为明文。
      enabled: true
      # 仅当正文 UTF-8 字节长度达到阈值时尝试压缩。
      threshold-bytes: 256

